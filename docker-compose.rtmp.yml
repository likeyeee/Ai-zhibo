# 本地 RTMP，用来试推流，不代替抖音。
# 启动：docker compose -f docker-compose.rtmp.yml up
# 推流地址 rtmp://127.0.0.1:1935/live ，串流密钥随便填，例如 preview
# 用浏览器看：http://localhost:8888/live/preview
services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
      - "8888:8888"
    restart: unless-stopped
